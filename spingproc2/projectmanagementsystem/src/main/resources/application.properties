spring.application.name=projectmanagementsystem
server.port=5001

spring.datasource.url=jdbc:mysql://localhost:3306/project_management?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<your_email_address>
spring.mail.password=<your_password>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

razorpay.api.keyId=YOUR_KEY_ID
razorpay.api.keySecret=YOUR_KEY_SECRET


